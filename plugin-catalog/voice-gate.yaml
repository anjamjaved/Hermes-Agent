description: "Reviews changed prose with 75 mechanical rule families and optional contextual review against the complete humanizer skill and its references. Settings keep everyday controls visible and collapse Vale, bots, and individual rules. Slow inventory requests allow up to two minutes and offer retry; the page includes five-row exceptions and Vale installation guidance. Revision requests allow at most two opportunities and compare protected spans and quantities. Prose em dashes are flagged while bullet label separators and empty table values remain allowed. Reads the changed prose paths reported by Hermes; manual tools can check supplied text. Model review is off by default and sends reviewed documents to the configured Hermes provider when enabled. It provides editorial judgments, not authorship proof. Vale is optional; status, checks, and pinned installation request approval before starting a program. No project-file writes or core overrides. Simple PDF text extraction has no OCR."
maintainer: apoapostolov
